services:
  naukri-bot:
    # For Development
    build: .
    image: naukri-bot:latest
    # image: ghcr.io/crackedngineer/naukri-bot:latest
    container_name: naukri-bot
    shm_size: "2gb" # Chrome needs more than Docker's default 64MB /dev/shm
    env_file:
      - .env
    environment:
      - NAUKRI_USERNAME=${NAUKRI_USERNAME}
      - NAUKRI_PASSWORD=${NAUKRI_PASSWORD}
      - NAUKRI_MOBILE=${NAUKRI_MOBILE}
      - NAUKRI_ORIGINAL_RESUME_PATH=${NAUKRI_ORIGINAL_RESUME_PATH}
      # - NAUKRI_MODIFIED_RESUME_PATH=${NAUKRI_MODIFIED_RESUME_PATH}
      - NAUKRI_SALARY=${NAUKRI_SALARY}
    volumes:
      - ./${NAUKRI_ORIGINAL_RESUME_PATH}:/app/${NAUKRI_ORIGINAL_RESUME_PATH}:ro # put your resume next to this file
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots

volumes:
  naukri_logs: