name: Naukri Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      packages: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare directories
        run: |
          mkdir -p screenshots
          touch naukri.log

      - name: Pull latest image
        run: docker compose pull

      - name: Run bot
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_MOBILE: ${{ secrets.NAUKRI_MOBILE }}
          NAUKRI_SALARY: ${{ secrets.NAUKRI_SALARY }}
          NAUKRI_ORIGINAL_RESUME_PATH: /app/resume.pdf
          NAUKRI_MODIFIED_RESUME_PATH: /app/resume.pdf
        run: |
          docker compose up \
            --abort-on-container-exit \
            --exit-code-from naukri-bot

      - name: Show logs
        if: always()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-log
          path: naukri.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-screenshots
          path: screenshots/