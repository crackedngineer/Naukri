name: Naukri Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare directories
        run: |
          mkdir -p screenshots
          touch naukri.log

      - name: Build Docker image
        run: docker compose build --pull

      - name: Run Naukri Bot
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_MOBILE: ${{ secrets.NAUKRI_MOBILE }}
          NAUKRI_SALARY: ${{ secrets.NAUKRI_SALARY }}
          NAUKRI_ORIGINAL_RESUME_PATH: /app/resume.pdf
          NAUKRI_MODIFIED_RESUME_PATH: /app/resume.pdf
        run: |
          docker compose up \
            --abort-on-container-exit \
            --exit-code-from naukri-bot

      - name: Show container logs
        if: always()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-log
          path: naukri.log
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-screenshots
          path: screenshots/
          retention-days: 14